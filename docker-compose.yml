services:

  # =========================================================
  # PostgreSQL + pgvector
  # =========================================================

  postgres:
    image: pgvector/pgvector:pg16
    container_name: research-radar-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: research_radar
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d research_radar"
        ]
      interval: 5s
      timeout: 5s
      retries: 10


  # =========================================================
  # FastAPI Backend
  # =========================================================

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: research-radar-backend
    restart: unless-stopped

    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/research_radar

    ports:
      - "8000:8000"

    depends_on:
      postgres:
        condition: service_healthy

    volumes:
      - ./backend:/app

    command: >
      sh -c "
      alembic upgrade head &&
      uvicorn app.main:app
      --host 0.0.0.0
      --port 8000
      "


  # =========================================================
  # React + Vite + Nginx Frontend
  # =========================================================

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

      # IMPORTANT:
      # Vite embeds this value during npm run build.
      # The browser calls the backend through localhost.
      args:
        VITE_API_BASE_URL: http://localhost:8000

    container_name: research-radar-frontend
    restart: unless-stopped

    ports:
      - "5173:80"

    depends_on:
      - backend


# ===========================================================
# Persistent Volumes
# ===========================================================

volumes:
  postgres_data: